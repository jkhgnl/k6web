<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户主页 - K6Web</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: #1c2433; min-height: 100vh; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: #fff; border-bottom: 1px solid #eef1f5; position: sticky; top: 0; z-index: 100; }
.brand { font-size: 16px; font-weight: 700; color: #2f6fdc; }
.container { max-width: 720px; margin: 24px auto; padding: 0 16px; }

/* 用户卡片 */
.profile-card { background: #fff; border-radius: 16px; padding: 32px 28px; box-shadow: 0 2px 12px rgba(0,0,0,.06); margin-bottom: 20px; text-align: center; }
.pp-avatar { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 14px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #2f6fdc, #5b8def); overflow: hidden; }
.pp-avatar img { width: 100%; height: 100%; object-fit: cover; }
.pp-name { font-size: 20px; font-weight: 700; color: #1c2433; margin-bottom: 6px; }
.pp-bio { font-size: 14px; color: #5b6472; line-height: 1.6; margin-bottom: 10px; white-space: pre-wrap; }
.pp-meta { font-size: 12px; color: #a3aab6; }

/* 作品区 */
.works-section { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
.works-section h2 { font-size: 16px; font-weight: 600; color: #1c2433; margin-bottom: 16px; }
.ws-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.ws-item { cursor: pointer; border: 1px solid #eef1f5; border-radius: 12px; padding: 14px; background: #fbfcfe; transition: transform .15s, box-shadow .15s; display: flex; flex-direction: column; }
.ws-item:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(31,45,80,.1); }
.ws-item-thumb { width: calc(100% + 64px); aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; margin: 0 -32px 8px; background: #f4f6fa; }
.ws-item-nothumb { width: calc(100% + 64px); aspect-ratio: 16/9; border-radius: 8px; margin: 0 -32px 8px; background: linear-gradient(135deg, #eef4ff, #e6ecf9); display: flex; align-items: center; justify-content: center; font-size: 28px; }
.ws-item-cat { font-size: 11px; color: #8892a0; background: #f4f6fa; padding: 2px 8px; border-radius: 999px; display: inline-block; margin-bottom: 6px; }
.ws-item-title { font-size: 14px; font-weight: 600; color: #1c2433; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws-item-desc { font-size: 12px; color: #7c8594; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
.ws-item-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 8px; border-top: 1px dashed #eef1f5; font-size: 11px; color: #97a0ad; }
.ws-empty { text-align: center; padding: 36px 16px; color: #a3aab6; font-size: 14px; }
.loading { text-align: center; padding: 48px; color: #a3aab6; font-size: 14px; }
.back-link { font-size: 14px; color: #5b6472; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.back-link:hover { color: #2f6fdc; }
</style>
</head>
<body>

<header class="topbar">
  <a href="index.html" class="back-link">← 返回主页</a>
  <span class="brand">K6Web</span>
</header>

<div class="container">
  <div id="profileContent" class="loading">加载中…</div>
</div>

<script>
window.SUPABASE_URL = "https://cvlrmxqaidnyvsexyesf.supabase.co";
window.SUPABASE_PUBLISHABLE_KEY = "sb_publishable_rkRLxx4SMTxhtS0VfxYhug_OwQZaKJO";
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  const FUNC_BASE = window.SUPABASE_URL + "/functions/v1";
  const CATEGORIES = {
    logo: "🖼️ 开机图片", channel: "📋 信道模板",
    firmware: "💾 固件", theme: "🎨 自定义主题", other: "📦 其他作品",
  };
  const CATEGORY_ICONS = { logo: "🖼️", channel: "📋", firmware: "💾", theme: "🎨", other: "📦" };

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function fmtSize(bytes) {
    if (!bytes) return "0 B";
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(2) + " MB";
  }
  function fmtDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function safeAvatar(u) {
    return /^(https?:)?\/\//i.test(u || "") || /^data:image\//i.test(u || "") ? u : "";
  }

  async function load() {
    const params = new URLSearchParams(window.location.search);
    const userId = params.get("id");
    const el = document.getElementById("profileContent");
    if (!userId) { el.innerHTML = '<div class="ws-empty">缺少用户 ID</div>'; return; }

    try {
      const resp = await fetch(`${FUNC_BASE}/get-user-profile?id=${encodeURIComponent(userId)}`, {
        headers: { Authorization: "Bearer " + window.SUPABASE_PUBLISHABLE_KEY, apikey: window.SUPABASE_PUBLISHABLE_KEY },
      });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      const data = await resp.json();
      if (data.error) throw new Error(data.error);

      const p = data.profile;
      const avatar = safeAvatar(p.avatar_url);
      const avatarHtml = avatar
        ? `<img src="${avatar}" alt="">`
        : `<span>${escapeHtml((p.username || "匿").charAt(0).toUpperCase())}</span>`;

      const works = data.works || [];
      let worksHtml = "";
      if (works.length === 0) {
        worksHtml = '<div class="ws-empty">暂无上传作品</div>';
      } else {
        worksHtml = '<div class="ws-grid">' + works.map((it) => {
          const icon = CATEGORY_ICONS[it.category] || "📦";
          const catLabel = (CATEGORIES[it.category] || "其他作品").replace(/^[^\s]*\s/, "");
          const thumb = it.thumbnail_url
            ? `<img class="ws-item-thumb" src="${escapeHtml(it.thumbnail_url)}" alt="" loading="lazy">`
            : `<div class="ws-item-nothumb">${icon}</div>`;
          return `
            <div class="ws-item" onclick="location.href='index.html#ws-${it.id}'">
              ${thumb}
              <span class="ws-item-cat">${catLabel}</span>
              <div class="ws-item-title">${escapeHtml(it.title)}</div>
              <div class="ws-item-desc">${escapeHtml(it.description || "")}</div>
              <div class="ws-item-foot">
                <span>⬇️ ${it.download_count || 0}</span>
                <span>${fmtSize(it.file_size)}</span>
                <span>${fmtDate(it.created_at)}</span>
              </div>
            </div>`;
        }).join("") + '</div>';
      }

      el.innerHTML = `
        <div class="profile-card">
          <div class="pp-avatar">${avatarHtml}</div>
          <div class="pp-name">${escapeHtml(p.username || "匿名用户")}</div>
          ${p.bio ? `<div class="pp-bio">${escapeHtml(p.bio)}</div>` : ""}
          <div class="pp-meta">加入于 ${fmtDate(p.created_at)}</div>
        </div>
        <div class="works-section">
          <h2>TA 的作品 (${works.length})</h2>
          ${worksHtml}
        </div>`;
    } catch (e) {
      el.innerHTML = `<div class="ws-empty">加载失败：${escapeHtml(e.message)}</div>`;
    }
  }

  load();
})();
</script>
</body>
</html>
