name: SEO Push (IndexNow + Baidu)

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions: {}

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
      - name: Push URLs to IndexNow & Baidu
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
        run: node scripts/push-seo.mjs sitemap.xml
